name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev,report]"

    - name: Verify the Belebele files are the parallel corpus we assume
      run: python -m scripts.fetch_belebele --check

    - name: Run tests
      run: pytest tests/ -v --cov=edge_slm_ace --cov-report=term-missing

    # F401/F841/F541 are on because their absence let a dead import survive a
    # full audit, with the wrong reference arm used for every ablation.
    - name: Lint (syntax errors, undefined names, dead imports)
      run: flake8 src/ scripts/ tests/ --count --select=E9,F63,F7,F82,F401,F841,F541 --show-source --statistics

    - name: Check formatting
      run: black --check --target-version py311 src/ scripts/ tests/

    # One real adapt-then-evaluate run. The unit tests stub the model, so only
    # this exercises the harness integration end to end.
    - name: Smoke test one arm end to end
      run: |
        python -m scripts.run_arm \
          --model tiny-gpt2 --language en --arm scaffold_control \
          --output-dir "$RUNNER_TEMP/arm" --limit 4 --device cpu --no-chat-template
        test -s "$RUNNER_TEMP/arm/metrics.json"
        test -s "$RUNNER_TEMP/arm/predictions.jsonl"
