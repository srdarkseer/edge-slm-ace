name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev,metrics,plots]"

    - name: Run tests
      run: pytest tests/ -v --cov=edge_slm_ace --cov-report=term-missing

    # F401/F841/F541 are on because their absence let a dead import survive a
    # full audit: scripts/compare_arms.py imported reference_for and
    # is_ablation and called neither, so ablations were compared against the
    # wrong arm while the tests for that mapping passed.
    - name: Lint (syntax errors, undefined names, dead imports)
      run: flake8 src/ scripts/ tests/ --count --select=E9,F63,F7,F82,F401,F841,F541 --show-source --statistics

    - name: Check formatting
      run: black --check --target-version py311 src/ scripts/ tests/

    # Exercises one real end-to-end run. The unit tests never call
    # run_experiment.py, so a defect in its plumbing -- a CSV header that fell
    # behind its writer, for instance -- reached the grid unchallenged.
    - name: Smoke test the ACE pipeline end to end
      run: |
        python -m scripts.run_experiment \
          --model-id tiny-gpt2 \
          --task-name sciq_tiny \
          --mode ace \
          --limit 2 \
          --max-new-tokens 8 \
          --playbook-path "$RUNNER_TEMP/playbook.jsonl" \
          --output-path "$RUNNER_TEMP/results.csv" \
          --metrics-path "$RUNNER_TEMP/metrics.json" \
          --predictions-path "$RUNNER_TEMP/predictions.jsonl"
        test -s "$RUNNER_TEMP/metrics.json"
        test -s "$RUNNER_TEMP/playbook_log.csv"
