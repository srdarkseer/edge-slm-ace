name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev,metrics,plots]"

    - name: Run tests
      run: pytest tests/ -v --cov=edge_slm_ace --cov-report=term-missing

    - name: Lint (syntax errors and undefined names)
      run: flake8 src/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check formatting
      run: black --check src/ scripts/ tests/
