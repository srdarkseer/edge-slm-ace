name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev,report]"

    - name: Verify the Belebele files are the parallel corpus we assume
      run: python -m scripts.fetch_belebele --check

    - name: Run tests
      run: pytest tests/ -v --cov=edge_slm_ace --cov-report=term-missing

    # Which checks and why: .flake8, which `make lint` reads too.
    - name: Lint (syntax errors, undefined names, dead imports)
      run: flake8 src/ scripts/ tests/ --count --show-source --statistics

    - name: Check formatting
      run: black --check --target-version py311 src/ scripts/ tests/

    # One real adapt-then-evaluate run. The unit tests stub the model, so only
    # this exercises the harness integration end to end.
    #
    # The arm has to be one that adapts. This ran `scaffold_control`, which is
    # in NO_PLAYBOOK_ARMS, so the loop this project owns -- Reflector, Curator,
    # add_entry, prune, freeze, save -- was never executed in CI at all,
    # underneath a comment claiming it was.
    - name: Smoke test the adapt-then-evaluate loop
      run: |
        python -m scripts.run_arm \
          --model tiny-gpt2 --language en --arm tinyace \
          --output-dir "$RUNNER_TEMP/arm" --limit 4 --device cpu --no-chat-template
        test -s "$RUNNER_TEMP/arm/metrics.json"
        test -s "$RUNNER_TEMP/arm/predictions.jsonl"
        test -f "$RUNNER_TEMP/arm/playbook.jsonl"
        test -s "$RUNNER_TEMP/arm/adaptation_log.csv"

    # The control arm takes the other branch through run_arm, so it is not
    # covered by the run above.
    - name: Smoke test the no-playbook branch
      run: |
        python -m scripts.run_arm \
          --model tiny-gpt2 --language en --arm scaffold_control \
          --output-dir "$RUNNER_TEMP/control" --limit 4 --device cpu --no-chat-template
        test -s "$RUNNER_TEMP/control/metrics.json"

    # Every arm the grid plans must at least be reachable, in the order it
    # plans them. Cheap, and it catches an unregistered or unrunnable arm
    # before a GPU is booked.
    - name: Check the grid plan
      run: python -m scripts.run_grid --models tiny-gpt2 --dry-run --results-root "$RUNNER_TEMP/grid"
