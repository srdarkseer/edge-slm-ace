[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyace-nepali"
version = "0.1.0"
description = "Test-time context adaptation for small language models on a low-resource language (Nepali)"
authors = [
    {name = "Suryodaya Shahi"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

# Scoring is lm-evaluation-harness; it brings torch and transformers via [hf].
# Nothing here re-implements a metric the harness already computes.
dependencies = [
    "lm-eval[hf]>=0.4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Query-conditioned retrieval. The encoder MUST be multilingual: an
# English-only model maps Devanagari to near-noise, which looks like retrieval
# and is not.
retrieval = [
    "sentence-transformers>=3.0.0",
]
report = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
]

# This is a research repository, not a library: the Belebele files in
# data/tasks/ and the entrypoints in scripts/ are deliberately outside the
# wheel, and the documented workflow assumes a git checkout. Install with
# `pip install -e ".[dev,retrieval,report]"` (what `make install` runs). If the
# package is ever installed away from its data, point TINYACE_DATA_ROOT at the
# directory containing data/tasks/.

[project.urls]
Homepage = "https://github.com/SirAlchemist1/edge-slm-ace"
Issues = "https://github.com/SirAlchemist1/edge-slm-ace/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
